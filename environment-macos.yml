# macOS (osx-64 and osx-arm64) environment for funannotate 1.9.0. EXPERIMENTAL.
# Derived from environment.yml with packages removed that have no macOS build:
# tbl2asn, repeatmodeler (needs perl-devel-size, no arm64 build), blat (osx-64 only works),
# codingquarry, perl-db-file,
# perl-mce, perl-soap-lite, lighttpd, libgomp, libffi, and the explicit R/Bioconductor list.
# Python is 3.10 or 3.11, as on Linux (Biopython 1.87+ needs 3.10): bioconda builds kmer-jellyfish 2.x for osx-arm64 only for
# py39 and newer, and Trinity needs jellyfish 2. Without this pin conda silently picks jellyfish 1.1.12.
# See docs/conda.rst, section 'macOS (experimental)'.
name: funannotate
channels:
- conda-forge
- bioconda
- nodefaults
dependencies:
- perl-libwww-perl
- fasta3
- blast >=2.16.0,<3
- repeatmasker >=4.2.3,<5
- miniprot >=0.18,<0.19
- minimap2 >=2.30,<3
- exonerate >=2.4.0,<3
- hmmer >=3.4,<4
- python >=3.10,<3.12
- pip *
- biopython >=1.87
- xlrd ==1.2.0
- augustus >=3.5.0
- goatools >=1.4.12,<2
- natsort >=8.4.0,<9
- numpy >=1.24.4,<2
- pigz >=2.8,<3
- tantan >=51,<52
- bedtools >=2.31.1,<3
- diamond >=2.0.5
- trnascan-se >=2.0
