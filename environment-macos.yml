- trimmomatic >=0.40,<0.41
- fastp
- hisat2 >=2.2.2,<3
- kallisto ==0.46.1
- stringtie
- salmon >=2.7,<3
- samtools
- glimmerhmm >=3.0.4,<4
- bamtools >=2.5.3,<3
- perl-yaml >=1.30,<2
