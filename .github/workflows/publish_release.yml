name: CD/Release
run-name: |
  Publish release - ${{ github.event.inputs.bump_type }} ${{ github.event.inputs.preid }} (${{ github.ref_name }})

# Release scheme (see scripts/release_version.py): funannotate/__version__.py
# holds VERSION and PRERELEASE. Release candidates are tagged v1.9.0-rc.N with
# PRERELEASE = "rc.N"; the final release is tagged v1.9.0 with PRERELEASE = ""
# and reports version 1.9.0.
#
# Run from the release branch (e.g. release/1.9):
#   prerelease            1.9.0-rc.4  -> 1.9.0-rc.5
#   prerelease, preid rc  1.9.0-beta.13 -> 1.9.0-rc.1
#   final                 1.9.0-rc.5  -> 1.9.0
#   patch/minor/major     1.9.0 -> 1.9.1 / 1.10.0 / 2.0.0
#   prepatch/preminor/premajor  1.9.0 -> 1.9.1-beta.1 / ... (preid, default beta)
#
# The job bumps __version__.py, CITATION.cff and CHANGES.md, commits, tags
# v<version>, builds and tests the sdist, pushes the commit and tag, creates the
# GitHub release, then starts the image and package workflows. Tags and
# releases made with GITHUB_TOKEN do not trigger other workflows, so those are
# started explicitly with workflow_dispatch.
#
# workflow_dispatch only lists workflows that exist on the default branch.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump"
        required: true
        type: choice
        default: "prerelease"
        options:
          - prerelease
          - final
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
      preid:
        description: "Pre-release stage alpha, beta or rc: switch to it with prerelease, or start it with pre* (default beta). Leave empty to keep the current stage."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare-release:
    name: Bump version, changelog and citation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      prerelease: ${{ steps.bump.outputs.prerelease }}

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Run this workflow from a release branch, not ${{ github.ref_type }} ${{ github.ref_name }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          PREID: ${{ github.event.inputs.preid }}
        run: |
          set -euo pipefail
          echo "Current version: $(python3 scripts/release_version.py current)"
          version="$(python3 scripts/release_version.py bump "$BUMP_TYPE" ${PREID:+--preid "$PREID"} --notes-file release-notes.md)"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (prerelease: ${prerelease})"
          git --no-pager diff --stat

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          # Only stage the files this workflow touches, never `git add .`
          git add funannotate/__version__.py
          git add CITATION.cff CHANGES.md 2>/dev/null || true
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git format-patch -1 HEAD --stdout > release-commit.patch

      - name: Upload patch and notes
        uses: actions/upload-artifact@v4
        with:
          name: release-patch
          path: |
            release-commit.patch
            release-notes.md

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download patch
        uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git am release-commit.patch
          rm release-commit.patch release-notes.md
          git tag -a "v${{ needs.prepare-release.outputs.version }}" -m "Release v${{ needs.prepare-release.outputs.version }}" HEAD
          python3 scripts/release_version.py check-tag "v${{ needs.prepare-release.outputs.version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tool
        run: python -m pip install build

      - name: Build Source Distribution (sdist)
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-unit:
    name: Unit tests (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build-sdist
    strategy:
      fail-fast: false
      # NOTE: setup.py pins python_requires <3.12 and the container runtime
      # is python >=3.6,<3.9; biopython<1.80 in install_requires has no
      # wheels for 3.11+, so cap the matrix at 3.10.
      matrix:
        python: ["3.8", "3.9", "3.10"]

    steps:
      # Full checkout: some tests read repo files (aux_scripts, install_scripts,
      # scripts). The package itself is imported from the installed sdist.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest and the package from sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.tar.gz

      # tests/test_training_selection.py runs diamond; it is the only external
      # tool the unit tests need. Static binary from the diamond releases.
      - name: Install diamond
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/bbuchfink/diamond/releases/download/v2.1.10/diamond-linux64.tar.gz \
            | tar xz -C "$HOME/.local/bin" diamond
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: |
          diamond version
          pytest -vv tests

  publish-release:
    name: Publish Release - v${{ needs.prepare-release.outputs.version }}
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-sdist
      - test-unit
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download patch
        uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git am release-commit.patch
          rm release-commit.patch
          git tag -a "v${VERSION}" -m "Release v${VERSION}" HEAD
          python3 scripts/release_version.py check-tag "v${VERSION}"

      - name: Push the release commit and tag
        run: git push origin "HEAD:refs/heads/${{ github.ref_name }}" "refs/tags/v${VERSION}"

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: v${{ needs.prepare-release.outputs.version }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare-release.outputs.prerelease != 'true' }}
          files: dist/*.tar.gz

      # The tag push and release above used GITHUB_TOKEN, which does not
      # trigger other workflows; start them on the new tag explicitly.
      - name: Start image and package workflows
        run: |
          for wf in container.yml release.yml release-triggered.yml python-publish.yml; do
            echo "Starting ${wf} on v${VERSION}"
            gh workflow run "${wf}" --ref "v${VERSION}"
          done
