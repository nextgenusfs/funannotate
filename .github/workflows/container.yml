# Builds and publishes the funannotate container image to GitHub Container
# Registry (GHCR), signs it with Cosign (Sigstore), attaches SLSA provenance
# attestations, and verifies the signature.
#
# - Every push of a v* tag: builds the image (./Dockerfile) and publishes it
#   as ghcr.io/<owner>/funannotate:vX.Y.Z and :X.Y.Z, plus :latest for stable
#   (non-prerelease) releases. workflow_dispatch allows a manual rebuild.
#
# ./Dockerfile is the thin app layer (funannotate code only); it builds
# FROM ghcr.io/<owner>/funannotate-base:<base_tag>, the heavy conda-env +
# Trinity/PASA/EVM image published separately by container-base.yml. Pass
# base_tag on a manual dispatch to pin a specific known-good base; tag
# pushes default to :latest.
#
# The funannotate package itself is pip-installed from this same repo at
# git ref FUNANNOTATE_REF -- on a v* tag push that's the tag itself (e.g.
# v1.9.0), so the image always contains exactly the tagged/released commit,
# never a hardcoded branch. workflow_dispatch can override it via the
# funannotate_ref input to build an arbitrary ref (branch, other tag, sha).

name: Build and Sign Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'funannotate-base image tag to build FROM'
        required: false
        default: 'latest'
      funannotate_ref:
        description: 'funannotate git ref (tag/branch/sha) to install; defaults to the ref this workflow run is on'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rust, norust]
    outputs:
      # See container-base.yml's build job for why only the variant-invariant
      # `image` is threaded through job outputs, not per-leg tags/digests.
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A v* tag must match the release label in funannotate/__version__.py
      # (e.g. v1.9.0-rc.5 needs PRERELEASE = "rc.5"), or the image would
      # report a different version than its tag.
      - name: Check tag matches __version__.py
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_version.py check-tag "$TAG" --ref HEAD

      - name: Compute image tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          FUNANNOTATE_REF_INPUT: ${{ inputs.funannotate_ref }}
          # Default (rust) keeps bare tags; norust gets a -norust suffix on
          # every tag. See Dockerfile.base's ENABLE_RUST arg for what this
          # actually toggles (Trinity/PASA/EVM Rust components on or off).
          SUFFIX: ${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          ref="${REF_NAME}"
          version="${ref#v}"
          prerelease="false"
          case "$version" in *-*) prerelease="true" ;; esac
          funannotate_ref="${FUNANNOTATE_REF_INPUT:-$REF_NAME}"
          {
            echo "tags<<_EOF_"
            echo "${REGISTRY}/${IMAGE_NAME}:${ref}${SUFFIX}"
            if [ "${REF_TYPE}" = "tag" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${version}${SUFFIX}"
              if [ "$prerelease" = "false" ]; then
                echo "${REGISTRY}/${IMAGE_NAME}:latest${SUFFIX}"
              fi
            fi
            echo "_EOF_"
            echo "version=${version}"
            echo "funannotate_ref=${funannotate_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This image's ./Dockerfile builds FROM funannotate-base:<BASE_TAG>,
      # published separately by container-base.yml (workflow_dispatch only --
      # it never runs automatically on a v* tag push, unlike this workflow).
      # docker/build-push-action's own error for a missing base image is a
      # generic multi-line "manifest unknown" buried in the build log; fail
      # here instead with a direct pointer to the fix, before spending any
      # build time. Especially easy to hit for the norust leg the first time
      # a new base image line is cut: container-base.yml has to be dispatched
      # at least once to publish funannotate-base:<tag>-norust before this
      # leg can succeed.
      - name: Verify base image exists
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE: ${{ github.repository }}-base
          BASE_TAG: ${{ inputs.base_tag || 'latest' }}${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          base_ref="${REGISTRY}/${BASE_IMAGE}:${BASE_TAG}"
          echo "Checking base image exists: ${base_ref}"
          if ! docker buildx imagetools inspect "${base_ref}" >/dev/null 2>&1; then
            echo "::error::Base image '${base_ref}' not found on ${REGISTRY}."
            echo "::error::Run the 'Build and Sign Base Container Image' workflow (container-base.yml) via workflow_dispatch first -- it builds and publishes both the rust and norust base image variants in one run -- then re-run this workflow."
            exit 1
          fi
          echo "OK: ${base_ref} exists"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_TAG=${{ inputs.base_tag || 'latest' }}${{ matrix.variant == 'norust' && '-norust' || '' }}
            FUNANNOTATE_REF=${{ steps.meta.outputs.funannotate_ref }}
          cache-from: |
            type=gha,scope=funannotate-container-${{ matrix.variant }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}
          cache-to: |
            type=gha,mode=max,scope=funannotate-container-${{ matrix.variant }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }},mode=max

  sign:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rust, norust]
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # See container-base.yml's sign job for why this leg resolves its own
      # tag/digest instead of reading them from needs.build.outputs.
      - name: Resolve this leg's tag and digest
        id: resolve
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          tag="${IMAGE}:${REF_NAME}${SUFFIX}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign images
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

  provenance:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rust, norust]
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Resolve this leg's tag and digest
        id: resolve
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          tag="${IMAGE}:${REF_NAME}${SUFFIX}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance predicate
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          predicate_file="${RUNNER_TEMP}/slsa-provenance.json"
          cat > "${predicate_file}" <<JSON
          {
            "buildDefinition": {
              "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yml@${GITHUB_REF}",
              "externalParameters": {"variant": "${VARIANT}"},
              "internalParameters": {},
              "resolvedDependencies": []
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              },
              "metadata": {
                "invocationId": "${GITHUB_RUN_ID}",
                "startedOn": "${started_on}"
              },
              "byproducts": []
            }
          }
          JSON

      - name: Attach SLSA provenance
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate "${RUNNER_TEMP}/slsa-provenance.json" \
            --type=slsaprovenance1 \
            "${IMAGE}@${DIGEST}"

  verify:
    needs: [build, sign, provenance]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rust, norust]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Resolve this leg's tag and digest
        id: resolve
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          tag="${IMAGE}:${REF_NAME}${SUFFIX}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify signatures
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity="https://github.com/${REPO}/.github/workflows/container.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
