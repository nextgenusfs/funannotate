# Builds and publishes the funannotate container image to GitHub Container
# Registry (GHCR), signs it with Cosign (Sigstore), attaches SLSA provenance
# attestations, and verifies the signature.
#
# - Every push of a v* tag: builds the image (./Dockerfile) and publishes it
#   as ghcr.io/<owner>/funannotate:vX.Y.Z and :X.Y.Z, plus :latest for stable
#   (non-prerelease) releases. workflow_dispatch allows a manual rebuild.
#
# ./Dockerfile is the thin app layer (funannotate code only); it builds
# FROM ghcr.io/<owner>/funannotate-base:<base_tag>, the heavy conda-env +
# Trinity/PASA/EVM image published separately by container-base.yml. Pass
# base_tag on a manual dispatch to pin a specific known-good base; tag
# pushes default to :latest.
#
# The funannotate package itself is pip-installed from this same repo at
# git ref FUNANNOTATE_REF -- on a v* tag push that's the tag itself (e.g.
# v1.9.0), so the image always contains exactly the tagged/released commit,
# never a hardcoded branch. workflow_dispatch can override it via the
# funannotate_ref input to build an arbitrary ref (branch, other tag, sha).

name: Build and Sign Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'funannotate-base image tag to build FROM'
        required: false
        default: 'latest'
      funannotate_ref:
        description: 'funannotate git ref (tag/branch/sha) to install; defaults to the ref this workflow run is on'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          FUNANNOTATE_REF_INPUT: ${{ inputs.funannotate_ref }}
        run: |
          ref="${REF_NAME}"
          version="${ref#v}"
          prerelease="false"
          case "$version" in *-*) prerelease="true" ;; esac
          funannotate_ref="${FUNANNOTATE_REF_INPUT:-$REF_NAME}"
          {
            echo "tags<<_EOF_"
            echo "${REGISTRY}/${IMAGE_NAME}:${ref}"
            if [ "${REF_TYPE}" = "tag" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${version}"
              if [ "$prerelease" = "false" ]; then
                echo "${REGISTRY}/${IMAGE_NAME}:latest"
              fi
            fi
            echo "_EOF_"
            echo "version=${version}"
            echo "funannotate_ref=${funannotate_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_TAG=${{ inputs.base_tag || 'latest' }}
            FUNANNOTATE_REF=${{ steps.meta.outputs.funannotate_ref }}
          cache-from: |
            type=gha,scope=funannotate-container
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=funannotate-container
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SLSA provenance predicate
        run: |
          started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          predicate_file="${RUNNER_TEMP}/slsa-provenance.json"
          cat > "${predicate_file}" <<JSON
          {
            "buildDefinition": {
              "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yml@${GITHUB_REF}",
              "externalParameters": {},
              "internalParameters": {},
              "resolvedDependencies": []
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              },
              "metadata": {
                "invocationId": "${GITHUB_RUN_ID}",
                "startedOn": "${started_on}"
              },
              "byproducts": []
            }
          }
          JSON

      - name: Attach SLSA provenance
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate "${RUNNER_TEMP}/slsa-provenance.json" \
            --type=slsaprovenance1 \
            "${IMAGE}@${DIGEST}"

  verify:
    needs: [sign, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signatures
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity="https://github.com/${REPO}/.github/workflows/container.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
