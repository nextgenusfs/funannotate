# Builds and publishes the funannotate image with bundled databases
# (./Dockerfile2) to GitHub Container Registry. Dockerfile2 starts from the
# published slim image, so this workflow runs after the slim workflow succeeds.

name: CI to GHCR (funannotate with DBs)

on:
  workflow_run:
    workflows: ["CI to GHCR (funannotate-slim)"]
    types: [completed]
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Run after a successful slim build, or by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (with databases)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile2
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:slim
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:db
            ghcr.io/${{ github.repository }}:db-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
