# Builds and publishes the funannotate image with bundled databases
# (./Dockerfile2) to GitHub Container Registry on every push to the default
# branch.

name: CI to GHCR (funannotate with DBs)

on:
  push:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image (load locally for Dockerfile2)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          load: true
          tags: funannotate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (with databases)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile2
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:db
            ghcr.io/${{ github.repository }}:db-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
