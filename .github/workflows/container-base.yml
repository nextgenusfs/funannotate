# Builds and publishes the funannotate-base image (./Dockerfile.base) to
# GHCR: everything the app image (./Dockerfile, built by container.yml)
# needs except the funannotate Python package itself -- the conda env plus
# source-built Trinity/PASA/EVM/bowtie2. This is the slow, expensive build
# (conda solve + cargo/make from source), so it is NOT rebuilt on every
# funannotate release. Run it by hand (workflow_dispatch) whenever
# Dockerfile.base or install_scripts/** change, then trigger container.yml
# (optionally with base_tag set to this run's tag) to rebuild the app image
# on top of it.

name: Build and Sign Base Container Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish alongside :latest (e.g. a date or short description)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-base

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rust, norust]
    outputs:
      # `image` is the one thing genuinely constant across the matrix (same
      # repo name for both legs), so it's safe to share. Per-leg tag/digest
      # are deliberately NOT threaded through job outputs here: GitHub
      # Actions matrix-job outputs collapse to whichever leg happens to
      # finish last, so a same-named output written by both legs would
      # silently hand `sign` the wrong leg's digest half the time. `sign`
      # instead re-resolves its own leg's tag (deterministic from
      # matrix.variant) and looks up that tag's digest directly from the
      # registry.
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tags
        id: meta
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          EXTRA_TAG: ${{ inputs.tag }}
          # Default (rust) keeps the bare tag; norust gets a -norust suffix.
          # See Dockerfile.base's ENABLE_RUST arg for what this actually
          # toggles (Trinity/PASA/EVM Rust components on or off).
          SUFFIX: ${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          {
            echo "tags<<_EOF_"
            echo "${REGISTRY}/${IMAGE_NAME}:latest${SUFFIX}"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${EXTRA_TAG}${SUFFIX}"
            fi
            echo "_EOF_"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENABLE_RUST=${{ matrix.variant == 'rust' }}
            FUNANNOTATE_EVM_ENGINE=${{ matrix.variant == 'rust' && 'rust' || 'perl' }}
          cache-from: |
            type=gha,scope=funannotate-base-${{ matrix.variant }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}
          cache-to: |
            type=gha,mode=max,scope=funannotate-base-${{ matrix.variant }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }},mode=max

  sign:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rust, norust]
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Resolve this leg's tag and digest
        id: resolve
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SUFFIX: ${{ matrix.variant == 'norust' && '-norust' || '' }}
        run: |
          tag="${IMAGE}:latest${SUFFIX}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
