# Builds and publishes the funannotate image with bundled databases
# (./Dockerfile2) to GitHub Container Registry on every published release.
#
# Dockerfile2 extends the standard image, so it is built in two steps: the
# base image (./Dockerfile) is built and loaded locally first, then
# Dockerfile2 is built on top and pushed.

name: Release funannotate (with DBs) to GHCR

# Controls when the action will run.
on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "${tag}" ]; then
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image (load locally for Dockerfile2)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          load: true
          tags: funannotate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (with databases)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile2
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}-db
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-db
          cache-from: type=gha
          cache-to: type=gha,mode=max
