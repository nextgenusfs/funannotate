# Builds and publishes the funannotate image with bundled databases
# (./Dockerfile2) to GitHub Container Registry on every published release.
#
# Dockerfile2 extends the release image ghcr.io/<repo>:<tag>, which the
# "Build and Sign Container Image" workflow (container.yml) builds from the
# same v* tag. That image must exist before this workflow runs; the check step
# fails with a clear message if it does not.

name: Release funannotate (with DBs) to GHCR

# Controls when the action will run.
on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only build/publish for version tags (v*); data-only releases such as
    # db-mirror must not produce images or packages.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "${tag}" ]; then
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the release image exists
        run: |
          image="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}"
          if ! docker buildx imagetools inspect "${image}" > /dev/null; then
            echo "::error::${image} does not exist. Run 'Build and Sign Container Image' for this tag first."
            exit 1
          fi

      - name: Build and push (with databases)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile2
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}-db
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-db
          cache-from: type=gha
          cache-to: type=gha,mode=max
