# Builds a Singularity/Apptainer .sif for a released funannotate image and
# attaches it to the GitHub Release as an asset.

name: CI Singularity

on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build .sif from GHCR image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: eWaterCycle/setup-apptainer@v2

      - name: Build .sif for the released tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "${tag}" ]; then
            tag="${{ github.ref_name }}"
          fi
          echo "Building .sif for ${tag}"
          apptainer build \
            "funannotate-${tag}.sif" \
            "docker://ghcr.io/${GITHUB_REPOSITORY}:${tag}"

      - name: Attach .sif to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "${tag}" ]; then
            echo "workflow_dispatch: skipping release upload (no release event)"
            exit 0
          fi
          gh release upload "${tag}" "funannotate-${tag}.sif" --clobber --repo "${{ github.repository }}"
